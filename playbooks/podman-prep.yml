---
- name: Prepare docker.pikaviestin.fi for podman
  hosts: docker.pikaviestin.fi
  vars:
    container_appdata_dir: /opt/docker/appdata
    podman_migration_dir: /opt/podman-migration
    podman_migration_stamp: "{{ ansible_facts.date_time.iso8601_basic_short }}"
    # Bind-mounted host dirs outside appdata (the mobilizon compose project).
    podman_extra_backup_paths:
      - /etc/docker/compose/docker-mobilizon
  tasks:
    - name: Create migration working directory
      ansible.builtin.file:
        path: "{{ podman_migration_dir }}/{{ podman_migration_stamp }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [snapshot, backup]

    # docker inspect output contains secrets (env vars), keep it root-only and
    # on the host; nothing is fetched to the controller.
    - name: List docker containers
      ansible.builtin.command: docker ps -a --format '{{ "{{" }}.Names{{ "}}" }}'
      register: podman_prep_containers
      changed_when: false
      check_mode: false
      tags: [snapshot]

    - name: List docker networks
      ansible.builtin.command: docker network ls --format '{{ "{{" }}.Name{{ "}}" }}'
      register: podman_prep_networks
      changed_when: false
      check_mode: false
      tags: [snapshot]

    # Only volumes attached to a container matter; dangling ones are leftovers
    # (image VOLUME declarations of old containers) and are not migrated.
    - name: List docker volumes in use
      ansible.builtin.command: docker volume ls -q --filter dangling=false
      register: podman_prep_volumes
      changed_when: false
      check_mode: false
      tags: [snapshot]

    - name: Count dangling docker volumes
      ansible.builtin.command: docker volume ls -q --filter dangling=true
      register: podman_prep_dangling_volumes
      changed_when: false
      check_mode: false
      tags: [snapshot]

    - name: Save docker inspect of containers, networks and volumes
      ansible.builtin.shell: |
        set -eu
        out="{{ podman_migration_dir }}/{{ podman_migration_stamp }}"
        umask 077
        docker ps -a > "$out/containers.txt"
        docker images --digests > "$out/images.txt"
        {% if podman_prep_containers.stdout_lines %}
        docker inspect {{ podman_prep_containers.stdout_lines | map('quote') | join(' ') }} > "$out/containers.json"
        {% endif %}
        docker network inspect {{ podman_prep_networks.stdout_lines | map('quote') | join(' ') }} > "$out/networks.json"
        {% if podman_prep_volumes.stdout_lines %}
        docker volume inspect {{ podman_prep_volumes.stdout_lines | map('quote') | join(' ') }} > "$out/volumes.json"
        {% endif %}
      args:
        executable: /bin/bash
      changed_when: true
      tags: [snapshot]

    - name: Report docker volumes (not covered by appdata backup)
      ansible.builtin.debug:
        msg:
          - "In use, must be migrated separately (podman volume import): {{ podman_prep_volumes.stdout_lines | join(', ') or 'none' }}"
          - "Dangling, not migrated (clean up with 'docker volume prune'): {{ podman_prep_dangling_volumes.stdout_lines | length }}"
      tags: [snapshot]

    - name: Archive container appdata
      community.general.archive:
        path: "{{ container_appdata_dir }}"
        dest: "{{ podman_migration_dir }}/{{ podman_migration_stamp }}/appdata.tar.gz"
        format: gz
        mode: "0600"
      tags: [backup]

    # The postgres datadir in this tarball is copied live and may not be
    # consistent; take a pg_dump at cutover (see docs/podman-migration.md).
    - name: Archive other bind-mounted host dirs
      community.general.archive:
        path: "{{ item }}"
        dest: "{{ podman_migration_dir }}/{{ podman_migration_stamp }}/{{ item | basename }}.tar.gz"
        format: gz
        mode: "0600"
      loop: "{{ podman_extra_backup_paths }}"
      tags: [backup]

    # Do NOT install podman-docker: it conflicts with docker-ce-cli.
    - name: Install podman and tooling
      ansible.builtin.apt:
        name:
          - podman
          - slirp4netns
          - uidmap
          - aardvark-dns
          - netavark
        state: present
        update_cache: true
      register: podman_prep_apt
      tags: [install]

    # Docker-compatible API at /run/podman/podman.sock, used to run the mobilizon
    # compose project.
    - name: Enable podman API socket
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true
      when: not (ansible_check_mode and podman_prep_apt is changed)
      tags: [install]

    # Starts containers that have a restart policy (the mobilizon compose stack) at boot.
    - name: Enable podman-restart service for restart policies
      ansible.builtin.systemd:
        name: podman-restart.service
        enabled: true
      when: not (ansible_check_mode and podman_prep_apt is changed)
      tags: [install]

    - name: Check podman works
      ansible.builtin.command: podman info --format '{{ "{{" }}.Version.Version{{ "}}" }}'
      register: podman_prep_version
      changed_when: false
      when: not ansible_check_mode
      tags: [install]

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "podman {{ podman_prep_version.stdout | default('n/a') }} installed, podman.socket enabled"
          - "Snapshot/backup: {{ podman_migration_dir }}/{{ podman_migration_stamp }}"
          - "Docker containers left running: {{ podman_prep_containers.stdout_lines | default([]) | join(', ') }}"
