---
- name: Pre-pull podman images (no downtime)
  hosts: docker.pikaviestin.fi
  tags: [prepull, cutover]
  vars_files:
    - ../roles/podman_services/defaults/main.yml
  tasks:
    - name: Pull service images
      containers.podman.podman_image:
        name: "{{ item }}"
      loop: "{{ podman_prepull_images }}"

    - name: Pull mobilizon compose images into podman
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ mobilizon_compose_dir }}"
      environment:
        DOCKER_HOST: unix:///run/podman/podman.sock
      changed_when: false

- name: Stop docker (downtime starts)
  hosts: docker.pikaviestin.fi
  tags: [cutover]
  tasks:
    # Containers are not removed; `systemctl start docker` brings them back
    # (restart policies) for rollback.
    - name: Stop and disable docker
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [docker.socket, docker.service]

    # Docker leaves `FORWARD DROP` in iptables-nft, which also drops traffic
    # from netavark's nftables table (no container egress). Without docker the
    # default after reboot is ACCEPT.
    - name: Reset FORWARD policy left by docker
      ansible.builtin.iptables:
        chain: FORWARD
        policy: ACCEPT
        ip_version: "{{ item }}"
      loop: [ipv4, ipv6]

- name: Start podman services
  import_playbook: podman-containers.yml
  tags: [cutover]
