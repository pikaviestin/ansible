---
- name: "Cinny: data directory"
  ansible.builtin.file:
    path: "{{ container_appdata_dir }}/cinny"
    state: directory
    mode: "0755"

- name: "Cinny: homeserver config"
  ansible.builtin.template:
    src: config.json
    dest: "{{ container_appdata_dir }}/cinny/config.json"
    mode: "0644"

- name: "Cinny: service"
  ansible.builtin.include_role:
    name: uumas.podman.service
  vars:
    service_name: cinny
    service_container_image: "{{ cinny_image }}"
    service_container_publish_ports:
      - name: http
        container_port: 80
        host_address: 127.0.0.1
        host_port: "{{ cinny_http_port }}"
    service_container_mounts:
      - type: bind
        source: "{{ container_appdata_dir }}/cinny/config.json"
        destination: /app/config.json
        readonly: true

- name: "Cinny: vhost"
  ansible.builtin.include_tasks: vhost.yml
  vars:
    podman_vhost_service: cinny
    podman_vhost_port: "{{ cinny_http_port }}"
    podman_vhost_domains: [cinny.pikaviestin.fi]
