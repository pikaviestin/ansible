---
- name: Create cinny appdata directory
  file:
   path: "{{ container_appdata_dir }}/cinny"
   state: directory

- name: Copy Cinny hs config
  template:
   src: config.json
   dest: "{{ container_appdata_dir }}/cinny/config.json"

- name: Cinny Container
  docker_container:
   name: cinny
   image: ajbura/cinny:v4.12.6
   pull: yes
   restart_policy: unless-stopped
   volumes:
    - "{{ container_appdata_dir }}/cinny/config.json:/app/config.json"
   labels:
    traefik.enable: "true"
    traefik.http.routers.cinny-rtr.entrypoints: "websecure"
    traefik.http.routers.cinny-rtr.rule: Host("cinny.pikaviestin.fi")